name: Extract final 10 core 2024 values
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - .github/workflows/extract-final10-core-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr >/dev/null
      - name: Extract core tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lgpi2024

          cat > /tmp/lgpi2024/sources.tsv <<'EOF'
          halifax|https://cdn.halifax.ca/sites/default/files/documents/city-hall/budget-finances/march-31-2024-audited-financial-statements-cao-approved.pdf|text
          cape-breton|https://cbrm.ns.ca/wp-content/uploads/2026/01/2023-2024-CBRM_2023-24.pdf|ocr
          moncton|https://www5.moncton.ca/docs/budget/2024_Consolidated_Financial_Statements.pdf|ocr
          fredericton|https://www.fredericton.ca/media/file/cof-2024annualreport-en-pdf|text
          saint-john|https://saintjohn.ca/sites/default/files/documents/City%20of%20Saint%20John%20-%202024%20Consolidated%20FS%20-%20Final%20-%20Eng%20Statements.pdf|text
          st-johns|https://www.stjohns.ca/2024_Consolidated-Financial-Statements_City-of-St.-John%27s.pdf|text
          charlottetown|https://www.charlottetown.ca/UserFiles/Servers/Server_10500298/File/Mayor%20and%20Council/Finance/Audited%20Financial%20Statements/Draft%202024%20CoC%20Consolidated%20Financial%20Statements%20(1).pdf|ocr
          whitehorse|https://www.whitehorse.ca/wp-content/uploads/2025/10/COW-2024-AR-Web.pdf|text
          yellowknife|https://www.yellowknife.ca/en/city-government/resources/Reports/Annual_Report/2024-FINANCIAL-STATEMENTS.pdf|text
          iqaluit|https://iqaluit.ca/sites/default/files/2024_consolidated_financial_statements_eng_-_signed.pdf|text
          EOF

          while IFS='|' read -r slug url mode; do
            echo "===== SOURCE $slug ====="
            pdf="/tmp/lgpi2024/$slug.pdf"
            if [[ "$slug" == "moncton" ]]; then
              curl -k -L --retry 3 --retry-delay 2 -A "Mozilla/5.0 LGPI-reconstruction/0.2" -o "$pdf" "$url" || true
            else
              curl -L --retry 3 --retry-delay 2 -A "Mozilla/5.0 LGPI-reconstruction/0.2" -o "$pdf" "$url" || true
            fi
            if [[ ! -s "$pdf" ]]; then
              echo "DOWNLOAD FAILED"
              continue
            fi

            txt="/tmp/lgpi2024/$slug.txt"
            if [[ "$mode" == "ocr" ]]; then
              mkdir -p "/tmp/lgpi2024/$slug-pages"
              pdftoppm -f 1 -l 12 -jpeg -r 170 "$pdf" "/tmp/lgpi2024/$slug-pages/page" >/dev/null 2>&1 || true
              : > "$txt"
              for img in /tmp/lgpi2024/$slug-pages/*.jpg; do
                tesseract "$img" stdout --psm 6 2>/dev/null >> "$txt" || true
                printf '\n\f\n' >> "$txt"
              done
            else
              pdftotext -layout "$pdf" "$txt" || true
            fi

            echo "--- CORE MATCHES $slug ---"
            grep -Ein -B2 -A5               'total financial assets|financial assets$|total liabilities|financial liabilities|net financial assets|net financial debt|net debt|long[- ]term debt|tangible capital assets|total revenue|total revenues|total expenses|total expenditures|total expense'               "$txt" | head -n 260 || true
          done < /tmp/lgpi2024/sources.tsv
