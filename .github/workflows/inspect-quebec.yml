name: Inspect Quebec 2023 MAMH data

on:
  push:
    branches: [data/quebec-2023-mamh]
    paths:
      - "scripts/inspect_quebec_2023.py"
      - ".github/workflows/inspect-quebec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl beautifulsoup4
      - run: python scripts/inspect_quebec_2023.py
