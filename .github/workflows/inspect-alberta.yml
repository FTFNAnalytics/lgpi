name: Inspect Alberta 2023 workbook

on:
  push:
    branches: [data/alberta-2023-fir]
    paths:
      - "scripts/inspect_alberta_2023.py"
      - ".github/workflows/inspect-alberta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/inspect_alberta_2023.py
