name: Extract Regina 2024 financial tables
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - .github/workflows/extract-regina-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - name: Download and extract
        run: |
          python - <<'PY'
          import urllib.request
          url="https://openregina.ca/dataset/5e011351-3612-4a51-919d-914dcef52ffb/resource/f84fc149-0569-4a6b-8fc2-62c2ed18a138/download/cor-2024-annual-report.pdf"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LGPI-reconstruction/0.2"})
          with urllib.request.urlopen(req,timeout=180) as r:
              open("/tmp/regina.pdf","wb").write(r.read())
          PY
          pdftotext -layout /tmp/regina.pdf /tmp/regina.txt
          echo "=== FINANCIAL POSITION ==="
          grep -n -A45 -B5 -i "consolidated statement of financial position" /tmp/regina.txt | tail -n 110
          echo "=== OPERATIONS ==="
          grep -n -A65 -B5 -i "consolidated statement of operations" /tmp/regina.txt | tail -n 150
          echo "=== EXPENSE OBJECT ==="
          grep -n -A45 -B5 -i "expenses by object\|expense by object\|expenditures by object" /tmp/regina.txt | tail -n 100
          echo "=== DEBT ==="
          grep -n -A50 -B5 -i "long-term debt\|long term debt" /tmp/regina.txt | head -n 130
