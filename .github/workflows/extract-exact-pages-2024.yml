name: Extract exact 2024 statement pages
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - .github/workflows/extract-exact-pages-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr >/dev/null
      - name: Extract exact pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          extract_text () {
            slug="$1"; url="$2"; first="$3"; last="$4"; insecure="\${5:-no}"
            echo "===== $slug ====="
            if [[ "$insecure" == "yes" ]]; then
              curl -k -L -A "Mozilla/5.0 LGPI-reconstruction/0.2" -o "/tmp/x/$slug.pdf" "$url"
            else
              curl -L -A "Mozilla/5.0 LGPI-reconstruction/0.2" -o "/tmp/x/$slug.pdf" "$url"
            fi
            pdftotext -f "$first" -l "$last" -layout "/tmp/x/$slug.pdf" - || true
          }
          extract_ocr () {
            slug="$1"; url="$2"; first="$3"; last="$4"
            echo "===== $slug ====="
            curl -L -A "Mozilla/5.0 LGPI-reconstruction/0.2" -o "/tmp/x/$slug.pdf" "$url"
            mkdir -p "/tmp/x/$slug-pages"
            pdftoppm -f "$first" -l "$last" -jpeg -r 190 "/tmp/x/$slug.pdf" "/tmp/x/$slug-pages/page" >/dev/null 2>&1
            for img in /tmp/x/$slug-pages/*.jpg; do
              echo "--- $img ---"
              tesseract "$img" stdout --psm 6 2>/dev/null || true
            done
          }

          extract_ocr "cape-breton" "https://cbrm.ns.ca/wp-content/uploads/2026/01/2023-2024-CBRM_2023-24.pdf" 6 9
          extract_text "fredericton" "https://www.fredericton.ca/media/file/cof-2024annualreport-en-pdf" 48 50
          extract_text "saint-john" "https://saintjohn.ca/sites/default/files/documents/City%20of%20Saint%20John%20-%202024%20Consolidated%20FS%20-%20Final%20-%20Eng%20Statements.pdf" 6 9
          extract_ocr "charlottetown" "https://www.charlottetown.ca/UserFiles/Servers/Server_10500298/File/Mayor%20and%20Council/Finance/Audited%20Financial%20Statements/Draft%202024%20CoC%20Consolidated%20Financial%20Statements%20(1).pdf" 5 9
          extract_text "iqaluit" "https://iqaluit.ca/sites/default/files/2024_consolidated_financial_statements_eng_-_signed.pdf" 4 9
