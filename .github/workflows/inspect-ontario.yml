name: Inspect Ontario 2023 FIR

on:
  push:
    branches: [data/ontario-2023-fir]
    paths:
      - "scripts/inspect_ontario_2023.py"
      - ".github/workflows/inspect-ontario.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inspect_ontario_2023.py
