name: Resolve Regina 2024 annual report URL
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - .github/workflows/resolve-regina-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json, urllib.request
          url="https://openregina.ca/api/3/action/package_show?id=5e011351-3612-4a51-919d-914dcef52ffb"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LGPI-reconstruction/0.2"})
          obj=json.load(urllib.request.urlopen(req,timeout=60))
          for r in obj["result"]["resources"]:
              text=" ".join(str(r.get(k,"")) for k in ("name","description","url","format"))
              if "2024" in text:
                  print(json.dumps({k:r.get(k) for k in ("id","name","url","format")},ensure_ascii=False))
          PY
