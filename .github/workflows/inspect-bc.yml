name: Inspect BC 2023 schedules

on:
  push:
    branches: [data/bc-2023-schedules]
    paths:
      - "scripts/inspect_bc_2023.py"
      - ".github/workflows/inspect-bc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl beautifulsoup4
      - run: python scripts/inspect_bc_2023.py
