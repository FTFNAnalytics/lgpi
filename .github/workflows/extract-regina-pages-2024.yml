name: Extract Regina 2024 statement pages
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - .github/workflows/extract-regina-pages-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - run: |
          python - <<'PY'
          import urllib.request
          url="https://openregina.ca/dataset/5e011351-3612-4a51-919d-914dcef52ffb/resource/f84fc149-0569-4a6b-8fc2-62c2ed18a138/download/cor-2024-annual-report.pdf"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 LGPI-reconstruction/0.2"})
          with urllib.request.urlopen(req,timeout=180) as r:
              open("/tmp/regina.pdf","wb").write(r.read())
          PY
          pdftotext -f 49 -l 62 -layout /tmp/regina.pdf -
