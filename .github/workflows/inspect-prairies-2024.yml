name: Inspect Prairie 2024 audited reports
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - scripts/inspect_prairies_2024.py
      - .github/workflows/inspect-prairies-2024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python scripts/inspect_prairies_2024.py
