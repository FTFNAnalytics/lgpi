name: Verify 2024 structured finance sources
on:
  push:
    branches: [data/2024-reconstruction]
    paths:
      - scripts/verify_2024_sources.py
      - .github/workflows/verify-2024-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_2024_sources.py
